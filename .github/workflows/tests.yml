name: Tests
on:
  push:
    branches:
      - master
      - main
      - dev
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...

      # the generated spec under docs/ is committed so it is readable without a build.
      # That owes a guarantee that it is not stale, which is this step. swag is pinned by
      # the tool directive in go.mod, so the generator cannot drift on its own either.
      - name: OpenAPI
        run: |
          go generate ./...
          git diff --exit-code -- docs/
          untracked="$(git ls-files --others --exclude-standard -- docs/)"
          if [ -n "$untracked" ]; then
            echo "go generate created files that are not committed:"
            echo "$untracked"
            exit 1
          fi

      - name: Test
        timeout-minutes: 120
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 120
          command: go test -short -timeout 99999s ./...
